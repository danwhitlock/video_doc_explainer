[project]
name = "explainer-engine"
version = "0.1.0"
description = "Document-to-narrated-explainer pipeline (portfolio demonstrator)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "pyyaml>=6",
    "typer>=0.12",
    "ollama>=0.4",
]

[project.scripts]
explainer = "pipeline.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.ruff]
line-length = 100
